apiVersion: 1

providers:
  - name: kdi-phase3-dashboards
    orgId: 1
    folder: KDI-P0
    type: file
    disableDeletion: false
    updateIntervalSeconds: 30
    editable: false
    options:
      path: /var/lib/grafana/dashboards
      foldersFromFilesStructure: false
  - name: opencloud-dashboards
    orgId: 1
    folder: OpenCloud
    type: file
    disableDeletion: false
    updateIntervalSeconds: 30
    editable: false
    options:
      path: /etc/grafana/provisioning/opencloud-dashboards
      foldersFromFilesStructure: false
